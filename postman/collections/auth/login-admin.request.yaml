$kind: http-request
name: "POST /auth/login admin (200)"
description: ""
url: "{{baseUrl}}/auth/login"
method: POST
headers:
  - key: "Content-Type"
    value: "application/json"
body:
  type: json
  content: "{\n  \"email\": \"{{adminEmail}}\",\n  \"password\": \"{{adminPassword}}\"\n}"
scripts:
  - type: afterResponse
    language: text/javascript
    code: "pm.test(\"Status 200\", function () {\n  pm.response.to.have.status(200);\n});\n\nconst token = pm.response.json().data.token;\npm.environment.set(\"adminToken\", token);"
order: 7000
