$kind: http-request
name: "POST /auth/login (200)"
description: ""
url: "{{baseUrl}}/auth/login"
method: POST
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: "{\n  \"email\": \"{{userEmail}}\",\n  \"password\": \"{{userPassword}}\"\n}"
scripts:
  - type: afterResponse
    language: text/javascript
    code: "pm.test(\"Status 200\", function () {\n  pm.response.to.have.status(200);\n});\n\nconst token = pm.response.json().data.token;\npm.test(\"Devuelve token\", function () {\n  pm.expect(token).to.be.a(\"string\");\n});\npm.environment.set(\"token\", token);"
order: 4000
