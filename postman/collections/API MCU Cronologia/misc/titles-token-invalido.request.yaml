$kind: http-request
name: "POST /titles token invalido (401)"
description: "Header con formato Bearer pero el token no es un JWT valido: INVALID_TOKEN"
url: "{{baseUrl}}/titles"
method: POST
headers:
  - key: "Content-Type"
    value: "application/json"
  - key: "Authorization"
    value: "Bearer token.invalido"
body:
  type: json
  content: "{\n  \"kind\": \"movie\",\n  \"title\": \"Postman Test Title\",\n  \"releaseDate\": \"2030-01-01\"\n}"
scripts:
  - type: afterResponse
    language: text/javascript
    code: "pm.test(\"Status 401\", function () {\n  pm.response.to.have.status(401);\n});\n\npm.test(\"Codigo INVALID_TOKEN\", function () {\n  pm.expect(pm.response.json().error.code).to.eql(\"INVALID_TOKEN\");\n});"
order: 2000
