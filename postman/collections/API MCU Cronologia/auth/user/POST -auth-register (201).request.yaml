$kind: http-request
name: "POST /auth/register (201)"
description: ""
url: "{{baseUrl}}/auth/register"
method: POST
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: "{

    \  \"username\": \"{{userName}}\",

    \  \"email\": \"{{userEmail}}\",

    \  \"password\": \"{{userPassword}}\"

    }"
scripts:
  - type: afterResponse
    language: text/javascript
    code: "pm.test(\"Status 201\", function () {

      \  pm.response.to.have.status(201);

      });"
order: 1000
